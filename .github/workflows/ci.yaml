name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Upgrade pip, setuptools, and wheel
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Install package
        run: pip install -e .

      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

      - name: Run pytest
        run: python -m pytest -q

  docker:
    needs: checks
    runs-on: ubuntu-latest
    environment: ci
    env:
      APP_ENV: ${{ vars.APP_ENV }}
      EXPECTED_ENV: ${{ vars.APP_ENV }}
      BASE_URL: ${{ vars.BASE_URL }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Install package
        run: pip install -e .
      - name: Start compose
        run: docker compose up --build -d --wait
      - name: Smoke tests
        run: python -m pytest -q tests/smoke
      - name: Integration tests
        run: python -m pytest -q tests/integration
      - name: Stop compose
        if: always()
        run: docker compose down -v

  pylint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Install package
        run: pip install -e .
      - name: Run pylint
        run: pylint src tests
