services:
  db:
    image: postgres:17
    container_name: finance_db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER Not set in .env file}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD Not set in .env file}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB Not set in .env file}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: finance_api
    environment:
      APP_ENV: "${APP_ENV:?APP_ENV Not set in .env file}"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
